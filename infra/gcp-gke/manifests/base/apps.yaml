apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle-service
  template:
    metadata:
      labels:
        app: oracle-service
    spec:
      containers:
        - name: oracle-service
          image: oracle-service
          ports:
            - containerPort: 8088
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
          envFrom:
            - configMapRef:
                name: liken-config
            - secretRef:
                name: liken-secrets
          env:
            - name: PORT
              value: "8088"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/oracle_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: liken-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liken-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 70
            periodSeconds: 20
      volumes:
        - name: app-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oracle-service
spec:
  selector:
    app: oracle-service
  ports:
    - port: 8088
      targetPort: 8088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: liken-config
            - secretRef:
                name: liken-secrets
          env:
            - name: PORT
              value: "8090"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 70
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  annotations:
    cloud.google.com/backend-config: '{"default":"liken-gateway-backend-config"}'
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  annotations:
    cloud.google.com/backend-config: '{"default":"liken-frontend-backend-config"}'
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
