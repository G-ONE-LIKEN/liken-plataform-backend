apiVersion: apps/v1
kind: Deployment
metadata:
  name: invest-dividend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invest-dividend-service
  template:
    metadata:
      labels:
        app: invest-dividend-service
    spec:
      containers:
        - name: invest-dividend-service
          image: invest-dividend-service
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: liken-config
            - secretRef:
                name: liken-secrets
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/invest_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: liken-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liken-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 75
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: invest-dividend-service
spec:
  selector:
    app: invest-dividend-service
  ports:
    - port: 8083
      targetPort: 8083
