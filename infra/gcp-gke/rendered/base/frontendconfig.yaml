apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: liken-frontend-config
  namespace: app
spec:
  # Redirige todo el tráfico HTTP (80) a HTTPS (443) una vez que el
  # ManagedCertificate esté ACTIVE.
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
