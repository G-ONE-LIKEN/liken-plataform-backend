apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: liken-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "direct-apply"
    targetRevision: "main"
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

