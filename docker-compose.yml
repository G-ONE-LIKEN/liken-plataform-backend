# Levanta toda la plataforma localmente.
#
# Uso:
#   docker compose up --build        # primera vez o despues de cambiar codigo
#   docker compose up                # sin cambios de codigo (usa imagenes en cache)
#   docker compose up --build <nombre>  # rebuild solo un servicio
#   docker compose down              # bajar todo (datos persisten)
#   docker compose down -v           # bajar todo y borrar datos
#   docker compose logs -f <nombre>  # ver logs de un servicio

# ── Logging por defecto ────────────────────────────────────────────────────────
# 10 MB × 3 rotaciones = 30 MB max por servicio.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# ── JVM: variables de entorno para todos los Spring Boot ──────────────────────
# JAVA_TOOL_OPTIONS se fusiona con los flags fijos del ENTRYPOINT del Dockerfile.
# Ajusta -Xmx/-Xms si un servicio puntual necesita mas heap.
x-spring-env: &spring-env
  JAVA_TOOL_OPTIONS: >-
    -Xmx180m
    -Xms80m
    -Xss256k
    -XX:ReservedCodeCacheSize=48m
    -XX:MaxMetaspaceSize=192m
    -XX:+DisableExplicitGC
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_MAIN_LAZY_INITIALIZATION: "false"
  SPRING_MAIN_BANNER_MODE: "off"          # deshabilitar el banner en los logs (ahorras lineas de logs)
  LOGGING_LEVEL_ROOT: "warn"              # el nivel de report lo paso a warning para enfocarnos en errores.
  LOGGING_LEVEL_ORG_APACHE_KAFKA: "warn"  # idem, para el de kafka
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA: "warn"
  INTERNAL_API_KEY: "${INTERNAL_API_KEY:-dev-internal-secret}"

# ── Recursos para todos los Spring Boot ───────────────────────────────────────
# memory: 180 heap + 96 metaspace + 48 code cache + ~76 OS/JVM overhead = ~400 MB
# cpus: 0.50 → cada servicio puede usar maximo 50ms cada 100ms de CPU.
#   No limita a infra (postgres, kafka, zookeeper) para que arranquen rapido.
x-spring-deploy: &spring-deploy
  resources:
    limits:
      memory: 512M
      cpus: "0.50"

services:
  # ════════════════════════════════════════════════════════════
  # INFRAESTRUCTURA
  # ════════════════════════════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: liken_postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liken_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-user_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Sin limite de CPU: postgres necesita burst al arrancar y en queries pesadas.
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-liken_user} -d ${POSTGRES_DB:-user_db}",
        ]
      interval: 15s # era 10s — reducimos frecuencia para aliviar disco
      timeout: 5s
      retries: 5
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: liken_zookeeper
    logging: *default-logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr"
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms64m" # era 256m/128m

    deploy:
      resources:
        limits:
          memory: 196M
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: liken_kafka
    logging: *default-logging
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx192m -Xms96m"                # era 256m/128m

      KAFKA_LOG_RETENTION_HOURS: 2                       # Reduce retencion en disco para dev local
      KAFKA_LOG_SEGMENT_BYTES: 52428800                  # 50 MB por segmento
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/localhost/9092' 2>/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: liken_redis
    logging: *default-logging
    ports:
      - "6379:6379"
    # maxmemory evita que redis crezca sin freno si se usan como cache
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  fake-gcs:
    image: fsouza/fake-gcs-server:1.49.2 # fijamos version, no latest
    container_name: liken_fake_gcs
    logging: *default-logging
    command: >
      -scheme http
      -host 0.0.0.0
      -port 4443
      -public-host fake-gcs:4443
      -external-url http://fake-gcs:4443
    ports:
      - "4443:4443"
    volumes:
      - fake_gcs_data:/storage
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4443/storage/v1/b || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  fake-gcs-init:
    image: curlimages/curl:8.7.1
    container_name: liken_fake_gcs_init
    logging: *default-logging
    depends_on:
      fake-gcs:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -c
      - |
        echo "Creando bucket liken-documents en fake-gcs..."
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -X POST \
          'http://fake-gcs:4443/storage/v1/b?project=liken-dev' \
          -H 'Content-Type: application/json' \
          -d '{"name":"liken-documents"}')
        if [ "$$STATUS" = "200" ] || [ "$$STATUS" = "409" ]; then
          echo "OK (HTTP $$STATUS) — bucket disponible"
          exit 0
        else
          echo "ERROR: HTTP $$STATUS al crear el bucket"
          exit 1
        fi

  # ════════════════════════════════════════════════════════════
  # SERVICIOS SPRING BOOT
  # ════════════════════════════════════════════════════════════

  user-service:
    build:
      context: ./services/user-service
    container_name: liken_user_service
    logging: *default-logging
    volumes:
      - ./logs/user-service:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
      fake-gcs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "9090:8080"
    environment:
      <<: *spring-env
      PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: ${DB_USERNAME:-liken_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      APP_SEED_ADMIN: ${APP_SEED_ADMIN:-true}
      APP_SEED_ADMIN_EMAIL_1: ${APP_SEED_ADMIN_EMAIL_1:-local-admin-1@example.test}
      APP_SEED_ADMIN_PASSWORD_1: ${APP_SEED_ADMIN_PASSWORD_1:-change-me-admin-password}
      APP_SEED_ADMIN_EMAIL_2: ${APP_SEED_ADMIN_EMAIL_2:-local-admin-2@example.test}
      APP_SEED_ADMIN_PASSWORD_2: ${APP_SEED_ADMIN_PASSWORD_2:-change-me-admin-password-2}
      GCP_PROJECT_ID: liken-dev
      GCS_BUCKET_NAME: liken-documents
      GCS_EMULATOR_HOST: http://fake-gcs:4443
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}
      DIDIT_CALLBACK_URL: ${DIDIT_CALLBACK_URL:-http://localhost:3000/dashboard}
      JAVA_TOOL_OPTIONS: >-
        -Xmx180m
        -Xms80m
        -Xss256k
        -XX:ReservedCodeCacheSize=48m
        -XX:MaxMetaspaceSize=160m
        -XX:+DisableExplicitGC
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  auth-service:
    build:
      context: ./services/auth-service
    container_name: liken_auth_service
    logging: *default-logging
    volumes:
      - ./logs/auth-service:/app/logs
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      <<: *spring-env
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-with-at-least-32-characters}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      USER_SERVICE_URL: http://user-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      REDIS_HOST: redis
      REDIS_PORT: 6379
    deploy:
      <<: *spring-deploy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  project-service:
    build:
      context: ./services/project-service
    container_name: liken_project_service
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      <<: *spring-env
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/project_db
      DB_USERNAME: ${DB_USERNAME:-liken_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://user-service:8080
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8085
      GCP_PROJECT_ID: liken-dev
      GCS_BUCKET_NAME: liken-documents
      GCS_EMULATOR_HOST: http://fake-gcs:4443
    deploy:
      <<: *spring-deploy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  wallet-service:
    build:
      context: ./services/wallet-service
    container_name: liken_wallet_service
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      <<: *spring-env
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/wallet_db
      DB_USERNAME: ${DB_USERNAME:-liken_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    deploy:
      <<: *spring-deploy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8084/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  notification-service:
    build:
      context: ./services/notification-service
    container_name: liken_notification_service
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      <<: *spring-env
      PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: ${DB_USERNAME:-liken_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://user-service:8080
      PROJECT_SERVICE_URL: http://project-service:8082
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-LIKEN}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    deploy:
      <<: *spring-deploy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8087/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 100s

  invest-dividend-service:
    build:
      context: ./services/invest-dividend-service
    container_name: liken_invest_dividend_service
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      project-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      <<: *spring-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/invest_db
      DB_USER: ${POSTGRES_USER:-liken_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROJECT_SERVICE_URL: http://project-service:8082
      USER_SERVICE_URL: http://user-service:8080
      WEB3_RPC_URL: ${WEB3_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      DISTRIBUTOR_ADDRESS: ${DISTRIBUTOR_ADDRESS:-0x0000000000000000000000000000000000000000}
    deploy:
      <<: *spring-deploy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  blockchain-service:
    build:
      context: .
      dockerfile: services/blockchain-service/Dockerfile
    container_name: liken_blockchain_service
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      <<: *spring-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/blockchain_db
      DB_USER: ${POSTGRES_USER:-liken_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://user-service:8080
      PROJECT_SERVICE_URL: http://project-service:8082
      WEB3_RPC_URL: ${WEB3_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      WEB3_CHAIN_ID: ${WEB3_CHAIN_ID:-11155111}
      WEB3_POLL_SECONDS: ${WEB3_POLL_SECONDS:-6}
      WEB3_MAX_BLOCK_RANGE: ${WEB3_MAX_BLOCK_RANGE:-500}
      WEB3_CONFIRMATIONS: ${WEB3_CONFIRMATIONS:-1}
      LKN_ADDRESS: ${LKN_ADDRESS:-0x0000000000000000000000000000000000000000}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:-0x0000000000000000000000000000000000000000}
      DISTRIBUTOR_ADDRESS: ${DISTRIBUTOR_ADDRESS:-0x0000000000000000000000000000000000000000}
      USDC_ADDRESS: ${USDC_ADDRESS:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      MARKETPLACE_ADDRESS: ${MARKETPLACE_ADDRESS:-0x0000000000000000000000000000000000000000}
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8085
      PUBLICATION_CONTRACTS_WORKSPACE: /contracts
      FORGE_COMMAND: ${FORGE_COMMAND:-forge}
      PUBLICATION_SCRIPT_ENTRY: ${PUBLICATION_SCRIPT_ENTRY:-script/DeployProjectOffering.s.sol:DeployProjectOffering}
      PUBLICATION_SIGNER_PRIVATE_KEY: ${PUBLICATION_SIGNER_PRIVATE_KEY:-}
      PLATFORM_ADMIN: ${PLATFORM_ADMIN:-0x0000000000000000000000000000000000000000}
      EMISOR_ADDRESS: ${EMISOR_ADDRESS:-0x0000000000000000000000000000000000000000}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-0x0000000000000000000000000000000000000000}
      PUBLICATION_DEADLINE_ZONE_ID: ${PUBLICATION_DEADLINE_ZONE_ID:-America/Argentina/Buenos_Aires}
    volumes:
      - ./contracts:/contracts
    deploy:
      resources:
        limits:
          memory: 450M  # resto se queda en 400M
          cpus: '0.50'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  marketplace-service:
    build:
      context: ./services/marketplace-service
    container_name: liken_marketplace_service
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      project-service:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      <<: *spring-env
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/marketplace_db
      DB_USER: ${POSTGRES_USER:-liken_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROJECT_SERVICE_URL: http://project-service:8082
      WALLET_SERVICE_URL: http://wallet-service:8084
      MARKETPLACE_FEE_PERCENT: ${MARKETPLACE_FEE_PERCENT:-1.0}
      ORDER_TTL_DAYS: ${ORDER_TTL_DAYS:-30}
    deploy:
      <<: *spring-deploy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  api-gateway:
    build:
      context: ./api-gateway
    container_name: liken_gateway
    logging: *default-logging
#    volumes:
#      - ./logs/api-gateway:/app/logs  # Al hacer esto, el volumen de Docker pisa por completo la carpeta creada en Dockerfile.
# El directorio pasa a pertenecer al usuario de la maquina local y, cuando appuser dentro del contenedor intenta escribir el archivo app.log,
# Linux le tira un Permission denied.
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      invest-dividend-service:
        condition: service_healthy
      marketplace-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      <<: *spring-env
      PORT: 8090
      FRONTEND_URL: http://localhost:*
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-with-at-least-32-characters}
      AUTH_URL: http://auth-service:8081
      USUARIOS_URL: http://user-service:8080
      PROYECTOS_URL: http://project-service:8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WALLET_URL: http://wallet-service:8084
      INVEST_URL: http://invest-dividend-service:8083
      MARKETPLACE_URL: http://marketplace-service:8086
      NOTIFICATION_URL: http://notification-service:8087
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    deploy:
      <<: *spring-deploy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8090/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  fake_gcs_data:
