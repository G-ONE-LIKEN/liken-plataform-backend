# Perfil de test: H2 en memoria + Kafka sin broker. Sin infraestructura externa.
spring.datasource.url=jdbc:h2:mem:oracle_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway deshabilitado: el ddl-auto crea el schema
spring.flyway.enabled=false

# Kafka: autoconfig deja el KafkaTemplate (productor lazy); consumers apagados.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false

# Intervalo grande para que el scheduler no dispare lecturas durante el test.
oracle.simulation.interval-ms=3600000
