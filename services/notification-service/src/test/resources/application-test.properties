# Perfil de test: H2 en memoria + Kafka deshabilitado. Sin infraestructura externa.
spring.datasource.url=jdbc:h2:mem:notification_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway deshabilitado: el ddl-auto crea el schema
spring.flyway.enabled=false

# Kafka deshabilitado en tests (no hay broker)
spring.kafka.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
