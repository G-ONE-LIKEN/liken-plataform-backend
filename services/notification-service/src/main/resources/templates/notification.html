<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title}">LIKEN</title>
</head>
<body style="margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f1419;color:#e6e6e6;">
  <div style="max-width:560px;margin:0 auto;padding:40px 24px;">
    <div style="background:#1a1f29;border:1px solid #2a2f3a;border-radius:16px;overflow:hidden;">
      <div style="background:linear-gradient(135deg,#10b981 0%,#059669 100%);padding:24px;text-align:center;">
        <h1 style="color:#0f1419;margin:0;font-size:22px;letter-spacing:2px;font-weight:700;">LIKEN</h1>
      </div>
      <div style="padding:32px 28px;">
        <p th:if="${firstName != null and !firstName.isEmpty()}"
           style="margin:0 0 12px 0;color:#94a3b8;font-size:14px;">
          Hola <span th:text="${firstName}">Usuario</span>,
        </p>
        <h2 style="margin:0 0 16px 0;color:#fff;font-size:20px;" th:text="${title}">Asunto</h2>
        <p style="margin:0 0 20px 0;color:#cbd5e1;line-height:1.6;font-size:15px;" th:text="${body}">
          Contenido principal del mensaje.
        </p>
        <p th:if="${reason != null and !reason.isEmpty()}"
           style="margin:16px 0;padding:12px 14px;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.08);border-radius:8px;color:#fca5a5;font-size:13px;">
          <strong>Motivo:</strong> <span th:text="${reason}">—</span>
        </p>
        <div style="margin-top:28px;text-align:center;">
          <a th:href="${frontendUrl + '/dashboard/notifications'}"
             style="display:inline-block;background:#10b981;color:#0f1419;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;">
            Ver en la plataforma
          </a>
        </div>
      </div>
      <div style="border-top:1px solid #2a2f3a;padding:20px 28px;font-size:12px;color:#64748b;text-align:center;">
        <p style="margin:0;">Recibís este email porque tenés una cuenta en LIKEN.</p>
      </div>
    </div>
  </div>
</body>
</html>
