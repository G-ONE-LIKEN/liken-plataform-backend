server.port=${PORT:8087}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Mail (MailHog en dev)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Cuando el puerto es 465 (Resend, Gmail SSL puro) hay que habilitar SSL desde el inicio.
# MailHog (puerto 1025) NO lo necesita — por eso default false.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
notification.mail.from=${MAIL_FROM:noreply@liken.local}
notification.mail.from-name=${MAIL_FROM_NAME:LIKEN}

# Thymeleaf (templates de email)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# Cliente user-service (para resolver audiencias del broadcast)
user-service.base-url=${USER_SERVICE_URL:http://localhost:8080}

# Frontend (para links en emails)
notification.frontend.base-url=${FRONTEND_URL:http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# SSE: timeout largo. El gateway debe respetar este timeout.
server.tomcat.connection-timeout=10m
