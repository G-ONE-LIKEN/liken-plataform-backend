server.port=${PORT:8087}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Mail (Resend SMTP)
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Resend por SMTP suele usar SSL directo en 465.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
notification.mail.from=${MAIL_FROM:onboarding@resend.dev}
notification.mail.from-name=${MAIL_FROM_NAME:LIKEN}

# Thymeleaf (templates de email)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# Cliente user-service (para resolver audiencias del broadcast)
user-service.base-url=${USER_SERVICE_URL:http://localhost:8080}
project-service.base-url=${PROJECT_SERVICE_URL:http://localhost:8082}

# Frontend (para links en emails)
notification.frontend.base-url=${FRONTEND_URL:http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# SSE: timeout largo. El gateway debe respetar este timeout.
server.tomcat.connection-timeout=10m

# Nombre del servicio (lo usa logback-spring.xml para etiquetar logs)
spring.application.name=notification-service

# ===== Observabilidad (ADR-0025) =====
# Tracing: traceId/spanId en MDC y propagacion W3C. Sampling 100% (volumen bajo).
management.tracing.sampling.probability=1.0
