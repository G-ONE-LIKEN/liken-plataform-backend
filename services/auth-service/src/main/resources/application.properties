server.port=${PORT:8081}

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===== Refresh Token =====
refresh-token.ttl-days=7

# ===== Comunicacion interna =====
services.user-service.url=${USER_SERVICE_URL:http://localhost:8080}
services.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8087}

# ===== Google OAuth =====
google.client-id=${GOOGLE_CLIENT_ID:}

# ===== Email verification =====
email-verification.ttl-minutes=${EMAIL_VERIFICATION_TTL_MINUTES:10}
email-verification.resend-cooldown-seconds=${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}

# Nombre del servicio (lo usa logback-spring.xml para etiquetar logs)
spring.application.name=auth-service
