server.port=${PORT:8081}

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===== Refresh Token =====
refresh-token.ttl-days=7

# ===== Comunicacion interna =====
services.user-service.url=${USER_SERVICE_URL:http://localhost:8080}
services.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8087}

# ===== Google OAuth =====
google.client-id=${GOOGLE_CLIENT_ID:}

# ===== Email verification =====
email-verification.ttl-minutes=${EMAIL_VERIFICATION_TTL_MINUTES:10}
email-verification.resend-cooldown-seconds=${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}

# ===== Resiliencia (circuit breaker hacia user-service) =====
# Ventana de 10 llamadas; abre al 50% de fallas; tras 15s pasa a half-open
# y prueba con 2 llamadas. Los 4xx de negocio no cuentan como falla.
resilience4j.circuitbreaker.instances.user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.user-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.user-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.user-service.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.user-service.register-health-indicator=true

# Estado de los breakers visible para la demo y monitoreo
management.endpoints.web.exposure.include=health,info,circuitbreakers,metrics
management.health.circuitbreakers.enabled=true

# Nombre del servicio (lo usa logback-spring.xml para etiquetar logs)
spring.application.name=auth-service

# ===== Observabilidad (ADR-0025) =====
# Tracing: traceId/spanId en MDC y propagacion W3C. Sampling 100% (volumen bajo).
management.tracing.sampling.probability=1.0
