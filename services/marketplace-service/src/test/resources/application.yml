spring:
  application:
    name: marketplace-service-test
  datasource:
    url: jdbc:h2:mem:marketplace_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: marketplace-service-test
      auto-offset-reset: earliest

server:
  port: 0

marketplace:
  fee-percent: 1.0
  order-ttl-days: 30

services:
  project-service-url: http://localhost:8082

logging:
  level:
    com.plataforma.marketplace: DEBUG
