spring:
  application:
    name: marketplace-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: marketplace-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.LinkedHashMap

server:
  port: ${SERVER_PORT:8086}

# Configuracion del marketplace
marketplace:
  fee-percent: ${MARKETPLACE_FEE_PERCENT:1.0}
  order-ttl-days: ${ORDER_TTL_DAYS:30}

services:
  project-service-url: ${PROJECT_SERVICE_URL:http://project-service:8082}
  wallet-service-url: ${WALLET_SERVICE_URL:http://wallet-service:8084}

logging:
  level:
    com.plataforma.marketplace: DEBUG
