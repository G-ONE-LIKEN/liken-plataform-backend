# src/test/resources/application-test.properties
# ──────────────────────────────────────────────────────────────────────────────
# Perfil "test" → tests @Tag("unit")
#
# Activo con: mvn test  (Surefire lo inyecta via systemPropertyVariables)
# También activo en @DataJpaTest con @ActiveProfiles("test")
#
# Caracteristicas:
#   - H2 en memoria, sin Docker, sin proceso externo → ejecucion instantanea
#   - Flyway deshabilitado; Hibernate crea el esquema con create-drop
#   - data.sql carga los datos de referencia (roles, permisos seed)
#   - app.seed-admin=false para no contaminar conteos en tests
# ──────────────────────────────────────────────────────────────────────────────

# ===== DataSource (H2 en modo compatibilidad PostgreSQL) =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: Hibernate genera las tablas al arrancar y las borra al cerrar.
# Flyway esta deshabilitado, asi que este es el unico gestor del esquema.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Garantiza que Hibernate crea las tablas ANTES de que data.sql las inserte.
spring.jpa.defer-datasource-initialization=true

# ===== Flyway =====
# Deshabilitado: Hibernate gestiona el esquema en este perfil.
spring.flyway.enabled=false

# ===== Kafka deshabilitado en tests unitarios =====
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# ===== GCS mock para tests (Storage es @MockBean cuando hace falta) =====
gcp.project-id=test-project
gcp.storage.bucket=test-bucket
gcp.storage.emulator-host=http://localhost:4443

# ===== Seed data.sql =====
# Spring ejecuta src/test/resources/data.sql una vez al arrancar el contexto.
spring.sql.init.mode=always

# ===== Security =====
app.seed-admin=false

# ===== Servidor =====
# Puerto 0 = aleatorio → evita conflictos si la app esta corriendo en local.
server.port=0

# ===== Didit KYC (mock para tests) =====
didit.api-key=test-api-key
didit.workflow-id=test-workflow-id
didit.callback-url=http://localhost:3000/dashboard?kyc=done
# ===== Internal API Key (Mock para tests) =====
INTERNAL_API_KEY=test-internal-api-key
