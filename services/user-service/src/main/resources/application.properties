# ===== Servidor =====
server.port=${PORT:8080}

# ===== NeonDB (PostgreSQL) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Google Cloud Storage (KYC documents — DD013/DD014) =====
gcp.project-id=${GCP_PROJECT_ID:liken-dev}
gcp.storage.bucket=${GCS_BUCKET_NAME:liken-documents}
# Para dev local con fake-gcs-server. En GKE, dejar vacío → SDK usa Workload Identity
gcp.storage.emulator-host=${GCS_EMULATOR_HOST:http://localhost:4443}

# ===== File upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Kafka (DD005/DD010/DD013) =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=user-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Nombre del servicio (lo usa logback-spring.xml para etiquetar logs)
spring.application.name=user-service

# ===== Observabilidad (ADR-0025) =====
# Tracing: traceId/spanId en MDC y propagacion W3C. Sampling 100% (volumen bajo).
management.tracing.sampling.probability=1.0
# Propagar el traceId a traves de Kafka (productor y consumidor)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.endpoints.web.exposure.include=health,info,metrics
