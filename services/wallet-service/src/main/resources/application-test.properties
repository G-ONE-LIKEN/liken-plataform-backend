# H2 en memoria para tests unitarios
spring.datasource.url=jdbc:h2:mem:wallet_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway deshabilitado en tests unitarios (ddl-auto crea el schema)
spring.flyway.enabled=false

# Kafka deshabilitado en tests unitarios
spring.kafka.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# ===== Internal API Key (Mock para tests) =====
INTERNAL_API_KEY=test-internal-api-key
