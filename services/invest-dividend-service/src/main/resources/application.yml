spring:
  application:
    name: invest-dividend-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invest_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: invest-dividend-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.LinkedHashMap

server:
  port: ${SERVER_PORT:8083}

# Read-only web3j para consultar el DividendDistributor.
web3:
  rpc-url: ${WEB3_RPC_URL:http://127.0.0.1:8545}

contracts:
  distributor: ${DISTRIBUTOR_ADDRESS:0x0000000000000000000000000000000000000000}

services:
  project-service-url: ${PROJECT_SERVICE_URL:http://project-service:8082}
  user-service-url: ${USER_SERVICE_URL:http://user-service:8080}

logging:
  level:
    com.plataforma.invest: DEBUG

spring:
  kafka:
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
